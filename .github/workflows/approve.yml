name: approve
on: workflow_dispatch
permissions:
  pull-requests: write
  contents: read
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: approve PR 1 via GITHUB_TOKEN
        run: |
          echo "attempting bot approval"
          gh pr review 1 --approve -b "approved by github-actions bot" -R $GITHUB_REPOSITORY || echo "APPROVE_FAILED rc=$?"
          echo "---reviews---"
          gh api repos/$GITHUB_REPOSITORY/pulls/1/reviews --jq '.[]|.state+"/"+.user.login'
        env:
          GH_TOKEN: ${{ github.token }}
